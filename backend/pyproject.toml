[project]
name = "k8s-hub-backend"
version = "0.1.0"
description = "K8s Hub - AI-assisted Kubernetes operations platform (backend)"
readme = "README.md"
# The development machine runs 3.14.
#
# The floor is 3.11 for a specific reason: only from 3.11 does LangChain pass
# RunnableConfig through contextvars in async functions. On 3.10, a node that forgets
# to pass config down LOSES STREAMING silently — the chat panel only
# shows tools running, never any text. See app/modules/nl_command/agent.py.
requires-python = ">=3.11"

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # --- Cache / queue ---
    "redis>=5.2.0",

    # --- LLM / agent ---
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.20",
    # The umbrella package is only needed by the Langfuse CallbackHandler: it reads
    # langchain.__version__ to tell v0 from v1. Without it, the import fails.
    "langchain>=1.0",
    # LLM providers — install only the ones in use
    "langchain-groq>=0.2.3",
    "langchain-google-genai>=2.0.8",
    "mcp>=1.1.0",

    # --- Kubernetes / observability sources ---
    "kubernetes-asyncio>=31.1.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",

    # --- Observability of the LLM/agent (use case) ---
    # Langfuse 3+ is built on OpenTelemetry. The two otel packages are declared explicitly
    # because app/modules/observability/ imports them directly, not only via langfuse.
    "langfuse>=3.0.0",
    "opentelemetry-api>=1.33.1",
    "opentelemetry-sdk>=1.33.1",

    # --- Self-monitoring of this app (metrics + structured logs) ---
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.4.0",

    # --- Auth ---
    "python-jose[cryptography]>=3.3.0",
    # Do NOT use passlib: unmaintained since 2020 and broken with
    # bcrypt>=4.1 (see app/core/security.py). Call bcrypt directly.
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
