[project]
name = "k8s-hub-backend"
version = "0.1.0"
description = "K8s Hub - AI-assisted Kubernetes operations platform (backend)"
readme = "README.md"
# Máy phát triển đang chạy 3.14.
#
# Sàn là 3.11 vì một lý do cụ thể: từ 3.11 trở lên LangChain mới tự chuyền
# RunnableConfig qua contextvars trong hàm async. Trên 3.10, nút nào quên
# truyền config xuống sẽ MẤT STREAMING mà không báo lỗi gì — khung chat chỉ
# hiện công cụ chạy, không hiện chữ nào. Xem app/modules/nl_command/agent.py.
requires-python = ">=3.11"

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # --- Cache / queue ---
    "redis>=5.2.0",

    # --- LLM / agent ---
    # Không khai `anthropic` ở đây: langchain-anthropic đã kéo nó theo.
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.20",
    # Nhà cung cấp LLM — chỉ cần cài cái nào đang dùng (xem config/llm.yaml)
    "langchain-groq>=0.2.3",
    "langchain-google-genai>=2.0.8",
    "langchain-anthropic>=0.3.0",
    "mcp>=1.1.0",

    # --- Kubernetes / observability sources ---
    "kubernetes-asyncio>=31.1.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",

    # --- Observability of the LLM/agent (use case) ---
    "langfuse>=3.0.0",

    # --- Self-monitoring of this app (metrics + structured logs) ---
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.4.0",

    # --- Auth ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
